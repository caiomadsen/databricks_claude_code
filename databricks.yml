# This is a Declarative Automation Bundle definition for databricks_claude_code.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: databricks_claude_code
  uuid: e2e1cf1e-13ab-465d-a4b5-f3841cdf9071

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-edefb166-9eb3.cloud.databricks.com
      profile: free
    variables:
      catalog: workspace
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://dbc-edefb166-9eb3.cloud.databricks.com
      profile: free
      # We explicitly deploy to /Workspace/Users/caio_madsen@hotmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/caio_madsen@hotmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
    permissions:
      - user_name: caio_madsen@hotmail.com
        level: CAN_MANAGE
